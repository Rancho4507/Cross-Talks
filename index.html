<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossTalks</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <header class="app-header">
    <div class="app-title">Cross-Talks</div>
    <div class="mode-badge">⚡ Online Mode</div>
  </header>

  <main class="translator-container">
    <!-- Input Panel (Left) -->
    <section class="panel input-panel">
      <div class="panel-header">
        <span class="panel-title">Source</span>
        <select id="source-lang">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="hi">Hindi</option>
        </select>
      </div>

      <textarea id="source-text" placeholder="Type or paste text to translate..."></textarea>

      <div class="panel-footer">
        <button id="mic-btn" class="btn btn-secondary">🎤 Speak</button>
        <button id="translate-btn" class="btn">Translate</button>
      </div>
    </section>

    <!-- Output Panel (Right) -->
    <section class="panel output-panel">
      <div class="panel-header">
        <span class="panel-title">Translation</span>
        <select id="target-lang">
          <option value="hi">Hindi</option>
          <option value="es">Spanish</option>
          <option value="en">English</option>
        </select>
      </div>

      <div id="output-text" class="output-box">Translation will appear here...</div>

      <div class="panel-footer">
        <button id="listen-btn" class="btn btn-secondary">🔊 Listen</button>
        <button id="copy-btn" class="btn btn-secondary">📋 Copy</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
